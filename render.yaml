services:
  - type: web
    name: unq-badge
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir web -w 1 --threads 16 -b 0.0.0.0:$PORT server:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_KEY
        value: Cheeku_Bhen_ka_Lauda_ha_mera_choco_cheeku_ke_muh_me
